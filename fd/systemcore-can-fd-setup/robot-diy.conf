# DIY SystemCore: vcan dummies report "state UNKNOWN", never "state UP"; accept both.
[Service]
ExecStartPre=
ExecStartPre=/bin/bash -c '\
 timeout=15; \
 while [[ $timeout > 0 ]]; do \
   good=true; \
   for can in can_s0 can_s1 can_s2 can_s3 can_s4; do \
     if ! ip link show $can up 2>/dev/null | grep -q -E "state (UP|UNKNOWN)"; then \
       good=false; \
       echo "$can down"; \
     fi; \
   done; \
   if [[ $good = true ]]; then \
     exit 0; \
   fi; \
   sleep 1; \
   timeout=$((timeout-1)); \
 done; \
 echo "could not find can bus interfaces"'
